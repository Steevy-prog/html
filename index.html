<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>

        <nav>

            <div class="logo">
                <img class="logo" src="assets/images/logo.png" alt="Archiva Logo">
            </div>
            <ul>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">CERs</a></li>
                <li><a href="#">Mes CER Favoris</a></li>
                <li><a href="#">Gestion de CER</a></li>
            </ul>
            
            <button class="connexion">Connexion</button>

        </nav>
    </header>
    <main>
        <section class="Hero">
            <div class="search-container">
                <img class="search-icon" src="assets/images/search.png" alt="Search Icon">
                <input type="search" class="search-input" placeholder="Rechercher un CER">
            </div>
            <h1>Bienvenue sur Archiva, votre espace</h1>
            <h2>Espace d'archivage d'anciens CERs</h2>
            <p>L'homme n'est rien sans son bord</p>
            <div class="button-container">
                <button class="explorer">Explorer plus de CER</button>
                <button class="view-CER">Tous les CERs</button>
            </div>
        </section>
    </main>
    <footer>
        
    </footer>
</body>
</html>
