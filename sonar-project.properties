# Clé unique du projet dans SonarQube
sonar.projectKey=archiva-backend
sonar.projectName=Archiva Backend
sonar.projectVersion=1.0

# Encodage des fichiers source
sonar.sourceEncoding=UTF-8

# Répertoires source et tests
sonar.sources=backend
sonar.tests=tests

# Exclusions
sonar.exclusions=**/vendor/**,**/node_modules/**,**/coverage-report/**,**/test-results/**,.phpunit.cache/**,backend/routes/**

# Patterns de tests
sonar.test.inclusions=tests/**/*Test.php

# Langage
sonar.language=php

# Rapports de couverture de code
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results/junit.xml

# Configuration PHP
sonar.php.version=7.4

# Règles de qualité
# Code Smells
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignorer les warnings sur les fonctions natives PHP
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# Ignorer les warnings sur la complexité cognitive dans les tests
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.php

# Ignorer les warnings sur les constantes magiques dans la config
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S109
sonar.issue.ignore.multicriteria.e3.resourceKey=backend/config/**

# Métriques de qualité (Quality Gates)
sonar.qualitygate.wait=true

# Scanner properties
sonar.scm.provider=git
sonar.scm.disabled=false

# Logs
sonar.log.level=INFO
sonar.verbose=false
