<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Toggle</title>
  <style>
    .side-bar {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
    }

    .hidden {
      display: none;
    }

    .toggle-btn {
      margin: 20px;
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="toggle-btn" onclick="toggleSidebar()">Toggle Sidebar</button>

  <div class="sidebar-wrapper">
    <div class="side-bar" id="sidebar">
      <h3>Niveau</h3>
      <input type="checkbox" id="niveau1"><label for="niveau1"> X1</label><br>
      <input type="checkbox" id="niveau2"><label for="niveau2"> X2</label><br>
      <input type="checkbox" id="niveau3"><label for="niveau3"> X3</label><br>
      <input type="checkbox" id="niveau4"><label for="niveau4"> X4</label><br>
      <input type="checkbox" id="niveau5"><label for="niveau5"> X5</label><br>

      <h3>Domaine de spécialisation</h3>
      <input type="checkbox" id="dom1"><label for="dom1"> Reseau & Infra</label><br>
      <input type="checkbox" id="dom2"><label for="dom2"> Securite</label><br>
      <input type="checkbox" id="dom3"><label for="dom3"> Genie logiciel</label><br>
      <input type="checkbox" id="dom4"><label for="dom4"> Data</label><br>
      <input type="checkbox" id="dom5"><label for="dom5"> Gestion de projet</label><br>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.side-bar'); // ✅ single element
      sidebar.classList.toggle('hidden'); // ✅ works now
    }
  </script>

</body>
</html>
