version: '3.8'

services:
  app:
    build:
      context: .
      target: ci
    environment:
      - DB_HOST=db
      - DB_DATABASE=test_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: test_db
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"
